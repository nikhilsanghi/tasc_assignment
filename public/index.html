<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Candidate-Role Match Intelligence</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="access-overlay" class="overlay">
  <div class="overlay-box">
    <h2>Access code</h2>
    <input id="access-input" type="password" placeholder="Enter access code" autocomplete="off">
    <button id="access-submit">Enter</button>
    <p id="access-error" class="error-text"></p>
  </div>
</div>

<main id="app" class="hidden">
  <h1>Candidate-Role Match Intelligence</h1>
  <p class="subtitle">A governed, steerable ranking copilot for in-house recruiters.</p>
  <div id="status-line" class="status-line hidden"></div>

  <section id="guidance-section" class="card">
    <label for="role-select">Role</label>
    <select id="role-select"></select>

    <label for="guidance-input">Guidance (optional)</label>
    <textarea id="guidance-input" rows="3" placeholder="e.g. prioritize candidates available immediately"></textarea>

    <button id="compile-btn">Compile</button>
  </section>

  <section id="echo-section" class="card hidden">
    <h2>What the system heard</h2>
    <p id="interpretation-text"></p>
    <div id="ops-list"></div>
    <div id="adjustments-list"></div>
    <div id="rejections-list"></div>
    <button id="confirm-score-btn">Confirm &amp; score</button>
  </section>

  <section id="score-section" class="card hidden">
    <h2>Ranked shortlist</h2>
    <p id="filtered-out-line"></p>
    <table id="score-table">
      <thead><tr><th></th><th>#</th><th>ID</th><th>Headline</th><th>Score</th><th>Band</th><th>Flags</th></tr></thead>
      <tbody></tbody>
    </table>
    <div id="insufficient-strip" class="strip hidden">
      <strong>Insufficient data — needs sourcing follow-up:</strong>
      <span id="insufficient-ids"></span>
    </div>
  </section>

  <section id="cards-section" class="card hidden">
    <h2>Candidate analysis</h2>
    <div id="analyst-cards"></div>
  </section>

  <section id="rerank-section" class="card hidden">
    <h2>Reranker second opinion</h2>
    <div id="rerank-disagreements"></div>
  </section>

  <section id="export-section" class="card hidden">
    <button id="export-btn">Approve &amp; export</button>
    <div id="export-output" class="hidden">
      <div id="markdown-preview"></div>
      <button id="download-md-btn">Download .md</button>
      <button id="download-audit-btn">Download audit.json</button>
    </div>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
